name: Daily Pipeline

on:
  schedule:
    - cron: "5 12 * * *"    # morning   — 12:05 UTC / 8:05 AM ET
    - cron: "5 17 * * *"    # afternoon — 17:05 UTC / 1:05 PM ET
    - cron: "5 22 * * *"    # evening   — 22:05 UTC / 6:05 PM ET
  workflow_dispatch:
    inputs:
      slot:
        description: "morning, afternoon, or evening"
        default: "morning"
      topic:
        description: "Topic ID (blank = random)"
        default: ""

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install Pillow numpy --quiet

      - name: Detect slot
        id: slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "12" ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "17" ]; then
              echo "slot=afternoon" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run pipeline
        env:
          GMAIL_ADDRESS:     ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL:      ${{ secrets.NOTIFY_EMAIL }}
          GH_PAT:            ${{ secrets.GH_PAT }}
          GH_REPO:           ${{ github.repository }}
          PIPELINE_SECRET:   ${{ secrets.PIPELINE_SECRET }}
          GITHUB_RUN_ID:     ${{ github.run_id }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          TOPIC_ARG=""
          [ -n "${{ github.event.inputs.topic }}" ] && TOPIC_ARG="--topic ${{ github.event.inputs.topic }}"
          python3 scripts/pipeline.py --slot ${{ steps.slot.outputs.slot }} $TOPIC_ARG